name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  make-draft-release:
    name: make draft release

    permissions: write-all

    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check if package version matches
        run: test "${GITHUB_REF_NAME}" = "v$(jq -r .version k8sight/package.json)"

      - name: Create draft release
        run: |
          gh release create ${GITHUB_REF_NAME} \
            --draft \
            --title ${GITHUB_REF_NAME} \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-app:
    name: build app

    needs:
      - make-draft-release

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: arm64
            concurrency: linux-arm64
          - os: ubuntu-22.04
            arch: x64
            concurrency: linux-amd64
          - os: macos-14
            arch: arm64
            concurrency: macos
          - os: macos-14
            arch: x64
            concurrency: macos
          - os: windows-2022
            arch: arm64
            concurrency: windows-arm64
          - os: windows-2022
            arch: x64
            concurrency: windows-amd64

    runs-on: ${{ matrix.os }}
    environment: signing

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref_name }}-${{ matrix.concurrency }}

    env:
      DO_NOT_TRACK: "1"
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      ELECTRON_HEADERS_CACHE: ${{ github.workspace }}/.cache/electron-headers
      # The production renderer bundle is ~40 MB unminified and its source map larger still, and
      # generating that map dies under the default heap -- as a hard V8 crash, not a tidy
      # out-of-memory error, which makes it look like anything but memory.
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -q update
          sudo apt-get -q install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bash coreutils python-setuptools

      - name: Add coreutils to PATH (macOS)
        if: runner.os == 'macOS'
        run: echo "/usr/local/opt/coreutils/libexec/gnubin" >> $GITHUB_PATH

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install yq --yes --no-progress

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Get pnpm cache directory
        shell: bash
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> ${GITHUB_ENV}

      - name: Use pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: ${{ matrix.os }}-${{ matrix.arch }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.arch }}-node-

      - name: Disable pre post scripts for pnpm
        shell: bash
        run: pnpm config set enablePrePostScripts false

      - name: Get Electron version
        shell: bash
        run: echo "electron_version=$(yq -r .importers.k8sight.devDependencies.electron.version pnpm-lock.yaml | sed 's/(.*)//')" >> $GITHUB_ENV

      - name: Get Electron Builder version
        shell: bash
        run: echo "electron_builder_version=$(yq -r .importers.k8sight.devDependencies.electron-builder.version pnpm-lock.yaml | sed 's/(.*)//')" >> $GITHUB_ENV

      - name: Use Electron cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: ${{ matrix.os }}-${{ matrix.arch }}-electron-${{ env.electron_version }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.arch }}-electron-

      - name: Use Electron Builder cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ matrix.os }}-${{ matrix.arch }}-electron-builder-${{ env.electron_builder_version }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.arch }}-electron-builder-

      - name: Use Electron headers cache
        id: electron-headers
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_HEADERS_CACHE }}
          key: electron-headers-${{ env.electron_version }}

      - name: Install pnpm dependencies
        id: install-pnpm
        shell: bash
        run: pnpm install --color=always --prefer-offline --frozen-lockfile
        continue-on-error: true

      - name: Install pnpm dependencies (retry)
        if: steps.install-pnpm.outcome == 'failure'
        shell: bash
        run: pnpm install --color=always --prefer-offline --frozen-lockfile

      - name: Install Electron headers
        if: steps.electron-headers.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p $ELECTRON_HEADERS_CACHE
          curl -sSfL https://www.electronjs.org/headers/v$electron_version/node-v$electron_version-headers.tar.gz -o $ELECTRON_HEADERS_CACHE/node-v$electron_version-headers.tar.gz

      - name: Enable downloading for all architectures (macOS x64, Linux arm64, Windows arm64)
        if: runner.os == 'macOS' && matrix.arch == 'x64' || runner.os == 'Linux' && matrix.arch == 'arm64' || runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: bash
        run: |
          echo "DOWNLOAD_ALL_ARCHITECTURES=true" >> $GITHUB_ENV

      - name: Build packages
        run: pnpm --color=always --stream build

      - name: Set cross-complilation environment (Linux arm64)
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: |
          echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Rebuild native packages for Electron
        run: pnpm --color=always electron-rebuild -a ${{ matrix.arch }}
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          npm_package_config_node_gyp_tarball: ${{ env.ELECTRON_HEADERS_CACHE }}/node-v${{ env.electron_version }}-headers.tar.gz

      - name: Build extra resources
        id: build-resources
        run: pnpm --color=always build:resources
        continue-on-error: true

      - name: Build extra resources (retry)
        id: build-resources-2
        if: steps.build-resources.outcome == 'failure'
        run: pnpm --color=always build:resources
        continue-on-error: true

      - name: Build extra resources (retry 2)
        if: steps.build-resources-2.outcome == 'failure'
        run: pnpm --color=always build:resources

      - name: Build Electron app (macOS)
        if: runner.os == 'macOS'
        run: |
          for var in APPLEID APPLEIDPASS APPLETEAMID CSC_LINK CSC_KEY_PASSWORD CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD; do
            test -n "${!var}" || unset $var
          done
          pnpm --color=always build:app \
            dmg pkg \
            --${{ matrix.arch }}
        env:
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          APPLETEAMID: ${{ secrets.APPLETEAMID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}

      - name: Notarize PKG (macOS)
        id: notarize-pkg
        if: runner.os == 'macOS'
        run: |
          if [[ -n $APPLEID && -n $APPLEIDPASS && -n $APPLETEAMID ]]; then
            pkgname=$(ls -1 k8sight/dist/K8Sight*.pkg | head -n1)
            auth="--apple-id $APPLEID --password $APPLEIDPASS --team-id $APPLETEAMID"
            xcrun notarytool submit $pkgname $auth --wait 2>&1 | tee k8sight/dist/notarytool.log
            uuid=$(awk '/id: / { print $2; exit; }' k8sight/dist/notarytool.log)
            sleep 60
            if [[ -n $uuid ]]; then
              xcrun notarytool log $uuid $auth
              xcrun stapler staple $pkgname
            fi
          fi
        env:
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          APPLETEAMID: ${{ secrets.APPLETEAMID }}
        continue-on-error: true

      - name: Notarize PKG (macOS) (retry)
        id: notarize-pkg-2
        if: runner.os == 'macOS' && steps.notarize-pkg.outcome == 'failure'
        run: |
          if [[ -n $APPLEID && -n $APPLEIDPASS && -n $APPLETEAMID ]]; then
            sleep 600
            pkgname=$(ls -1 k8sight/dist/K8Sight*.pkg | head -n1)
            auth="--apple-id $APPLEID --password $APPLEIDPASS --team-id $APPLETEAMID"
            xcrun notarytool submit $pkgname $auth --wait 2>&1 | tee k8sight/dist/notarytool.log
            uuid=$(awk '/id: / { print $2; exit; }' k8sight/dist/notarytool.log)
            sleep 60
            if [[ -n $uuid ]]; then
              xcrun notarytool log $uuid $auth
              xcrun stapler staple $pkgname
            fi
          fi
        env:
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          APPLETEAMID: ${{ secrets.APPLETEAMID }}
        continue-on-error: true

      - name: Notarize PKG (macOS) (retry 2)
        if: runner.os == 'macOS' && steps.notarize-pkg-2.outcome == 'failure'
        run: |
          if [[ -n $APPLEID && -n $APPLEIDPASS && -n $APPLETEAMID ]]; then
            sleep 600
            pkgname=$(ls -1 k8sight/dist/K8Sight*.pkg | head -n1)
            auth="--apple-id $APPLEID --password $APPLEIDPASS --team-id $APPLETEAMID"
            xcrun notarytool submit $pkgname $auth --wait 2>&1 | tee k8sight/dist/notarytool.log
            uuid=$(awk '/id: / { print $2; exit; }' k8sight/dist/notarytool.log)
            sleep 60
            if [[ -n $uuid ]]; then
              xcrun notarytool log $uuid $auth
              xcrun stapler staple $pkgname
            fi
          fi
        env:
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          APPLETEAMID: ${{ secrets.APPLETEAMID }}

      - name: Build Electron app (Linux)
        if: runner.os == 'Linux'
        run: |
          pnpm --color=always build:app \
            AppImage deb rpm \
            --${{ matrix.arch }}

      - name: Build Electron app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pnpm --color=always build:app \
            msi nsis \
            --${{ matrix.arch }}

      - name: Azure Trusted Signing (Windows)
        # Skipped unless the Azure Trusted Signing configuration is present. The action validates its
        # own inputs and throws when they are empty, which used to take the whole job down after the
        # installers had already been built. Add the secrets AZURE_TENANT_ID, AZURE_CLIENT_ID and
        # AZURE_CLIENT_SECRET plus the vars AZURE_ENDPOINT, AZURE_CODE_SIGNING_NAME and
        # AZURE_CERT_PROFILE_NAME to the `signing` environment and this step runs again on its own.
        if: runner.os == 'Windows' && vars.AZURE_CODE_SIGNING_NAME != '' && vars.AZURE_ENDPOINT != ''
        uses: azure/trusted-signing-action@v0.5.10
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_CODE_SIGNING_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\k8sight\dist
          files-folder-filter: exe,msi

      - name: Tweak binaries
        shell: bash
        run: |
          find . -name '*pty.node' -print0 | xargs -0 file
          rm -f k8sight/dist/*.blockmap

      - name: Normalize filenames before upload
        shell: bash
        run: |
          perl << 'END'
          chdir "k8sight/dist" or die $!;
          my %arch = (x64 => "amd64", arm64 => "arm64");
          my $arch = $arch{$ENV{ARCH}};
          while (<K8Sight*>) {
            my $src = $_;
            s/ Setup /-/;
            s/[ _]/-/g;
            if (/\.(dmg|exe|msi|pkg)$/ && !/-(amd64|arm64)\./) {
              s/\.(dmg|exe|msi|pkg)$/-$arch.$1/;
            }
            s/[.-](aarch64|arm64)/-arm64/;
            s/[.-](amd64|x86-64)/-amd64/;
            s/-(amd64|arm64).(dmg|pkg)$/-macos-$1.$2/;
            s/-(amd64|arm64).(AppImage|deb|flatpak|rpm|snap)$/-linux-$1.$2/;
            s/-(amd64|arm64).(exe|msi|)$/-windows-$1.$2/;
            my $dst = $_;
            if ($src ne $dst) {
              print "rename $src to $dst\n";
              rename $src, $dst or die $!;
            }
          }
          END
        env:
          ARCH: ${{ matrix.arch }}

      - name: Drop update metadata that must not be published
        shell: bash
        run: |
          # macOS: normally a no-op, since electron-builder writes latest-mac.yml only for a `zip`
          # target and this repo ships dmg and pkg. It is here so that adding `zip` later cannot
          # quietly start advertising an update macOS still cannot apply -- Squirrel.Mac refuses an
          # unsigned bundle, and both macOS jobs would write this same filename.
          rm -f k8sight/dist/latest-mac.yml k8sight/dist/latest-mac.json
          # Windows latest.yml carries no per-arch entries -- electron-updater takes the first .exe
          # it finds -- and both Windows jobs write one. Only x64 publishes, so the two cannot race
          # to overwrite each other; Windows on arm64 runs the x64 installer under emulation.
          if [[ $RUNNER_OS == Windows && $ARCH != x64 ]]; then
            rm -f k8sight/dist/latest.yml
          fi
          # Linux is already unambiguous: latest-linux.yml for x64, latest-linux-arm64.yml for arm64.
        env:
          ARCH: ${{ matrix.arch }}

      - name: Point update metadata at the renamed installers
        shell: bash
        run: |
          # electron-builder wrote latest*.yml against the names it produced, which the step above
          # has just renamed. An installed app follows those names literally, so a yml left pointing
          # at the old ones is a 404 for every user. Sizes and hashes are unaffected by a rename.
          perl << 'END'
          use strict;
          use warnings;
          chdir "k8sight/dist" or die $!;
          for my $meta (glob "latest*.yml") {
            open my $in, "<", $meta or die "$meta: $!";
            my @lines = <$in>;
            close $in;
            for my $line (@lines) {
              # Both the entries under `files:` and the legacy top-level `path:` name an artifact.
              next unless $line =~ /^(\s*(?:-\s+)?(?:url|path):\s+)(\S+)\s*$/;
              my ($prefix, $name) = ($1, $2);
              my ($ext) = $name =~ /\.([^.]+)$/ or die "no extension on $name in $meta";
              # One artifact of any given kind per job, so the extension identifies it outright.
              my @found = glob "K8Sight*.$ext";
              die "expected one .$ext for $meta, found: @found" unless @found == 1;
              $line = "$prefix$found[0]\n";
            }
            open my $out, ">", $meta or die "$meta: $!";
            print $out @lines;
            close $out;
            print "rewrote $meta\n";
          }
          END

      - name: Make checksums for binaries (Linux, Windows)
        if: runner.os == 'Linux' || runner.os == 'Windows'
        shell: bash
        run: |
          for f in k8sight/dist/K8Sight*.*; do
            pushd k8sight/dist > /dev/null
            sha256sum $(basename $f) | tee $(basename $f).sha256
            popd > /dev/null
          done

      - name: Make checksums for binaries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for f in k8sight/dist/K8Sight*.*; do
            pushd k8sight/dist > /dev/null
            shasum -a 256 $(basename $f) | tee $(basename $f).sha256
            popd > /dev/null
          done

      - name: List files before upload
        shell: bash
        run: |
          for f in k8sight/dist/K8Sight*.* k8sight/dist/latest*.yml; do
            test -e "$f" || continue
            echo "$(ls -l "$f")" "|" "$(file -b "$f")"
          done

      - name: Upload files
        shell: bash
        run: |
          gh release upload ${GITHUB_REF_NAME#sign/} k8sight/dist/K8Sight*.*
          # Without these an installed app has nothing to compare itself against and the in-app
          # updater is inert. --clobber so re-running a job replaces its own metadata; the pruning
          # step above already guarantees no two jobs publish the same name.
          if compgen -G "k8sight/dist/latest*.yml" > /dev/null; then
            gh release upload ${GITHUB_REF_NAME#sign/} k8sight/dist/latest*.yml --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-github-release:
    name: publish GitHub release

    needs:
      - make-draft-release
      - build-app

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish GitHub release
        run: gh release edit ${GITHUB_REF_NAME} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm-release:
    name: publish NPM release

    needs:
      - make-draft-release
      - build-app
      - publish-github-release

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64

    runs-on: ${{ matrix.os }}
    environment: publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        run: corepack enable

      - name: Get pnpm cache directory
        shell: bash
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> ${GITHUB_ENV}

      - name: Use pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: ${{ matrix.os }}-${{ matrix.arch }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.arch }}-node-

      - name: Install pnpm dependencies
        id: install-pnpm
        shell: bash
        run: pnpm install --color=always --prefer-offline --frozen-lockfile
        continue-on-error: true

      - name: Install pnpm dependencies (retry)
        if: steps.install-pnpm.outcome == 'failure'
        shell: bash
        run: pnpm install --color=always --prefer-offline --frozen-lockfile

      - name: Build packages
        run: pnpm --color=always --stream build

      - name: Publish npm packages
        id: publish-npm
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) dist_tag=next;;
            *) dist_tag=latest;;
          esac
          pnpm --color=always publish -r \
            --no-git-checks \
            --tag ${dist_tag}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Publish npm packages (retry)
        id: publish-npm-2
        if: steps.publish-npm.outcome == 'failure'
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) dist_tag=next;;
            *) dist_tag=latest;;
          esac
          pnpm --color=always publish -r \
            --no-git-checks \
            --tag ${dist_tag}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Publish npm packages (retry 2)
        if: steps.publish-npm-2.outcome == 'failure'
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) dist_tag=next;;
            *) dist_tag=latest;;
          esac
          pnpm --color=always publish -r \
            --no-git-checks \
            --tag ${dist_tag}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-apt-repository:
    name: Release APT repository

    needs:
      - make-draft-release
      - publish-github-release

    runs-on: ubuntu-24.04
    environment: apt-signing

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: GPG configuration
        run: |
          mkdir -p -m 0700 $HOME/.gnupg
          echo "use-agent" > $HOME/.gnupg/gpg.conf
          echo "pinentry-program $GITHUB_WORKSPACE/.github/scripts/pinentry.sh" > $HOME/.gnupg/gpg-agent.conf
          echo "$GPG_PASSPHRASE" > $HOME/.gnupg/passphrase
          gpgconf --launch gpg-agent
          echo "$GPG_PRIVATE_KEY" | gpg --import
          echo "$GPG_KEY_ID:6:" | gpg --import-ownertrust
        env:
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Release APT repository
        run: |
          set -x
          gh release download ${GITHUB_REF_NAME} -p "*.deb" -D tmp
          pushd tmp
            apt-ftparchive packages . | tee Packages | xz > Packages.xz
            apt-ftparchive release -c ../k8sight/build/apt/release.conf . > Release
            gpg --clearsign -o InRelease Release
            gpg --armor --detach-sign --sign -o Release.gpg Release
            gh release upload ${GITHUB_REF_NAME} InRelease Packages Packages.xz Release Release.gpg --clobber
          popd
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
